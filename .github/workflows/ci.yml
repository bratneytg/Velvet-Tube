name: CI
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Comprobar sintaxis
        run: for f in src/*.js src/services/*.js public/app.js; do node --check "$f"; done
      - name: Pruebas
        run: npm test
