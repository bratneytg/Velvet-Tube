<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Velvet Tube</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Velvet Tube" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="/estilos.css" />
</head>
<body>
  <!-- Código de acceso (solo si el servidor tiene ACCESS_CODE) -->
  <div id="overlayCodigo" class="overlay" hidden>
    <img class="logo-grande" src="/logo.png" alt="" />
    <h2 data-i18n="codigoTitulo"></h2>
    <input id="inputCodigo" type="password" autocomplete="current-password" data-i18n-placeholder="codigoPlaceholder" />
    <p id="codigoError" class="error" aria-live="polite"></p>
    <button id="btnCodigo" class="btn-primario" data-i18n="codigoEntrar"></button>
  </div>

  <header class="top">
    <div class="marca"><img src="/logo.png" alt="" /><span>Velvet <b>Tube</b></span></div>
    <div class="top-der">
      <div class="lang-sel" role="group" aria-label="Idioma / Language">
        <button class="lang-btn" data-lang="es">ES</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <div id="avisos" class="avisos" aria-live="polite"></div>

  <main class="grid">
    <!-- ================= REPRODUCTOR ================= -->
    <section class="panel reproductor" aria-label="Reproductor">
      <!-- Por defecto el vídeo de YouTube queda tapado por la miniatura de la canción (solo se oye el audio); el botón de abajo lo muestra. -->
      <div class="portada oculta" id="portada">
        <div id="ytPlayer"></div>
        <div id="miniatura" class="miniatura"></div>
        <button id="btnTocar" class="tocar" hidden data-i18n="tocarContinuar"></button>
      </div>
      <h1 id="titulo" class="titulo">—</h1>
      <p id="artista" class="artista" data-i18n="sinLista"></p>

      <div class="dj-card" id="djCard">
        <span class="dj-badge" id="djBadge"></span>
        <p class="dj-script" id="djScript"></p>
      </div>

      <div class="progreso">
        <span id="tActual">0:00</span>
        <div class="barra" id="barra" role="slider" aria-label="Progreso" tabindex="0"><div class="relleno" id="relleno"></div></div>
        <span id="tTotal">0:00</span>
      </div>

      <div class="controles">
        <button id="btnPrev" class="ctrl" data-i18n-aria="anterior"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12L18 18V6z"/></svg></button>
        <button id="btnPlay" class="ctrl grande" data-i18n-aria="reproducirPausa"><svg id="iconoPlay" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
        <button id="btnNext" class="ctrl" data-i18n-aria="siguiente"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      </div>

      <div class="fila-extra">
        <button id="btnDj" class="btn-dj"><span class="dj-dot"></span><span id="btnDjTxt"></span></button>
        <label class="volumen"><span aria-hidden="true">🔈</span><input id="rangoVol" type="range" min="0" max="100" value="100" data-i18n-aria="volumen" /></label>
      </div>
      <button id="btnVideo" class="btn-enlace"></button>
      <p id="notaMovil" class="nota" hidden data-i18n="notaMovil"></p>
    </section>

    <!-- ================= PANEL LATERAL ================= -->
    <section class="panel lateral">
      <div class="tabs" role="tablist">
        <button class="tab activo" data-tab="crear" role="tab" data-i18n="tabCrear"></button>
        <button class="tab" data-tab="cola" role="tab" data-i18n="tabCola"></button>
        <button class="tab" data-tab="guardadas" role="tab" data-i18n="tabGuardadas"></button>
      </div>

      <!-- Crear -->
      <div class="vista" id="vista-crear">
        <label for="inputPrompt" data-i18n="promptLabel"></label>
        <textarea id="inputPrompt" maxlength="300" rows="3" data-i18n-placeholder="promptPlaceholder"></textarea>
        <div class="fila">
          <div><label for="selCantidad" data-i18n="cantidad"></label>
            <select id="selCantidad"><option>10</option><option selected>20</option><option>30</option><option>40</option></select></div>
          <div><label for="selFreq" data-i18n="djHabla"></label>
            <select id="selFreq"><option value="1" data-i18n="cadaCancion"></option><option value="2" data-i18n="cada2"></option><option value="3" data-i18n="cada3"></option></select></div>
        </div>
        <div class="fila">
          <div><label for="selVoz" data-i18n="voz"></label>
            <select id="selVoz">
              <option value="es-f" data-i18n="vozEsF"></option><option value="es-m" data-i18n="vozEsM"></option>
              <option value="en-f" data-i18n="vozEnF"></option><option value="en-m" data-i18n="vozEnM"></option>
            </select></div>
        </div>
        <div>
          <label for="rangoVolVoz"><span data-i18n="volVoz"></span>: <span id="volVozValor">100%</span></label>
          <input id="rangoVolVoz" type="range" min="0" max="100" step="5" value="100" />
          <p id="avisoVolVozIos" class="estado" hidden data-i18n="volVozIos"></p>
        </div>
        <label for="inputAmbiente" data-i18n="ambienteLabel"></label>
        <textarea id="inputAmbiente" maxlength="300" rows="2" data-i18n-placeholder="ambientePlaceholder"></textarea>
        <label class="check"><input type="checkbox" id="chkUbicacion" /> <span data-i18n="usarUbicacion"></span></label>
        <button id="btnCrear" class="btn-primario" data-i18n="crear"></button>
        <p id="estadoCrear" class="estado" aria-live="polite"></p>
        <button id="btnProbarVoz" class="btn-secundario" data-i18n="probarVoz"></button>
        <p id="estadoVoz" class="estado" aria-live="polite"></p>
      </div>

      <!-- Cola -->
      <div class="vista" id="vista-cola" hidden>
        <div class="cola-cab"><h3 id="colaNombre"></h3><button id="btnGuardar" class="btn-enlace" hidden data-i18n="guardar"></button></div>
        <p id="colaDesc" class="estado"></p>
        <ol id="listaCola" class="cola"></ol>
        <p id="colaVacia" class="estado" data-i18n="colaVacia"></p>
      </div>

      <!-- Guardadas -->
      <div class="vista" id="vista-guardadas" hidden>
        <ul id="listaGuardadas" class="guardadas"></ul>
        <p id="guardadasVacio" class="estado" data-i18n="sinGuardadas"></p>
        <p class="nota" data-i18n="notaGuardadas"></p>
      </div>
    </section>
  </main>

  <audio id="djAudio" preload="auto"></audio>
  <audio id="pruebaAudio" preload="auto"></audio>
  <script src="/app.js" type="module"></script>
</body>
</html>
